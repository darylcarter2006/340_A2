spring.application.name=gumball-api

# Database connection comes from the SPRING_DATASOURCE_URL environment variable.
# Never put the connection string or password in this file.
spring.datasource.url=${SPRING_DATASOURCE_URL}

# Create/update the characters table automatically from the entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Use the port Render provides, or 8080 locally
server.port=${PORT:8080}
