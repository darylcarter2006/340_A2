<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add a Character</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<nav id="site-nav"></nav>

<main>
  <h1 id="form-title">Add a New Character</h1>
  <div id="status" class="status"></div>

  <form id="character-form" novalidate hidden>
    <div id="form-error" class="error-box" hidden></div>

    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>
    <span class="field-error" data-for="name"></span>

    <label for="species">Species</label>
    <input type="text" id="species" name="species">
    <span class="field-error" data-for="species"></span>

    <label for="role">Role</label>
    <input type="text" id="role" name="role">
    <span class="field-error" data-for="role"></span>

    <label for="age">Age</label>
    <input type="number" id="age" name="age" min="0" step="1">
    <span class="field-error" data-for="age"></span>

    <label for="imageUrl">Image URL</label>
    <input type="text" id="imageUrl" name="imageUrl" placeholder="/images/gumball.jpg or https://...">
    <span class="field-error" data-for="imageUrl"></span>

    <label for="description">Description</label>
    <textarea id="description" name="description" rows="5" required></textarea>
    <span class="field-error" data-for="description"></span>

    <button type="submit" id="submit-button">Add Character</button>
  </form>
</main>

<script type="module" src="/js/form.js"></script>
</body>
</html>
